<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Notícias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="teste.css">
</head>

<body class="p-4">

    <header class="container-fluid border-bottom py-3 mb-4 bg-secondary-subtle">
        <div class="container-fluid">
            <div class="row">
                <div class="col-3 ms-5 text-start">
                    <div class="">
                        <a><img src="/docs/images/alertaja.png" alt="Logo Alerta Já" class="ps-5 imageHeader"></a>
                    </div>
                </div>

                <div class="col-6 justify-content-center d-flex align-items-center">
                    <div class="input-group">
                        <input type="search" class="form-control rounded"
                            placeholder="Digite aqui uma notícia que você deseja procurar" id="ProcurarNoticia"
                            aria-label="Search" />
                    </div>

                    <div class="dropdown ps-1">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownCategorias"
                            data-bs-toggle="dropdown" aria-expanded="false" data-id-selecionado="">
                            Todas as categorias
                        </button>
                        <ul class="dropdown-menu" id="listaCategorias">
                            <li><a class="dropdown-item active" href="#" data-id="">Todas as categorias</a></li>
                        </ul>
                    </div>

                    <button class="btn btn-primary ms-1" data-bs-toggle="modal" data-bs-target="#modalNoticias">
                        Pesquisar
                    </button>
                </div>

            </div>
        </div>
    </header>

    <div class="modal" id="modalNoticias" tabindex="-1" aria-labelledby="modalNoticiasLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-topo">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" aria-label="Fechar">
                        ✕ Fechar Noticias
                    </button>
                </div>

                <!-- Cotainer das noticias -->
                <div class="modal-body p-0">
                    <div id="msgCarregando">Carregando...</div>
                    <div id="listaNoticias"></div>
                    <div id="msgVazio">Nenhuma notícia encontrada.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="teste.js">
    </script>
</body>

</html>
