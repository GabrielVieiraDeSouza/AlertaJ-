<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Notícias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="teste.css">
</head>

<body class="p-4">

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNoticias">
        Abrir Notícias
    </button>

    <div class="modal" id="modalNoticias" tabindex="-1" aria-labelledby="modalNoticiasLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">

                <div class="modal-topo">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" aria-label="Fechar">
                        ✕ Fechar Noticias
                    </button>
                </div>

                <!-- Cotainer das noticias -->
                <div class="modal-body p-0">
                    <div id="msgCarregando">Carregando...</div>
                    <div id="listaNoticias"></div>
                    <div id="msgVazio">Nenhuma notícia encontrada.</div>
                </div>

            </div>
        </div>
    </div>

    <script src="teste.js">
    </script>
</body>

</html>
