<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Dados - Alerta Já</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tema + estilos da parte do Ferlanio -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="perfil.css">
  <script>
    /* anti-flash: aplica o tema escuro antes de pintar */
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('alertaJa_config'));
        if (c && c.temaEscuro) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>

  <header class="perfil-header">
    <span class="brand">⚠️ Alerta Já</span>
    <nav>
      <a href="../index.html">Início</a>
      <a href="#">Configurações</a>
    </nav>
  </header>

  <main>
    <div class="perfil-card">
      <h1>Gerenciar Perfil — Meus Dados</h1>

      <div class="foto-perfil">
        <div class="circulo-foto" id="avatar">👤</div>
        <button type="button" class="btn-foto" id="btn-foto">Alterar Foto</button>
      </div>

      <form id="form-perfil">
        <label for="nomeCompleto">Nome Completo</label>
        <input type="text" id="nomeCompleto" placeholder="Seu nome completo" autocomplete="name">

        <label for="email">E-mail de Contato</label>
        <input type="email" id="email" placeholder="voce@exemplo.com" autocomplete="email">

        <label for="senha">Nova Senha <span style="font-weight:400;opacity:.7">(deixe em branco para manter)</span></label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="new-password">

        <label for="regiao">Região Principal de Monitoramento</label>
        <select id="regiao"></select>

        <div class="feedback" id="feedback"></div>

        <div class="acoes">
          <button type="submit" class="btn-salvar">Salvar Alterações</button>
          <button type="button" class="btn-excluir" id="btn-excluir">Excluir Minha Conta</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts da parte do Ferlanio (config-api antes dos demais) -->
  <script src="config-api.js"></script>
  <script src="perfil.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
