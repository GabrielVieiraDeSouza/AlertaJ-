<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alerta Já</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#efefef;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:900px;
}

.card-noticia{
    background:white;
    padding:30px;
    border-radius:20px;
    margin-top:40px;
    box-shadow:0 2px 12px rgba(0,0,0,0.1);
}

.card-noticia img{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:20px;
}

.categoria{
    background:#173A67;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    display:inline-block;
}

h1{
    margin-top:20px;
    margin-bottom:20px;
}

p{
    line-height:1.8;
    font-size:18px;
}

.btn-voltar{
    margin-top:20px;
}

.container-materia{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

.imagem-materia{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:20px;
}

.titulo-materia{
    font-size:3rem;
    font-weight:bold;
    margin-top:25px;
}

.texto-materia{
    font-size:1.15rem;
    line-height:1.9;
    color:#555;
}

@media(max-width:768px){

    .titulo-materia{
        font-size:2rem;
    }

    .imagem-materia{
        height:280px;
    }

    .texto-materia{
        font-size:1rem;
    }

}

@media(max-width:480px){

    .titulo-materia{
        font-size:1.5rem;
    }

    .imagem-materia{
        height:200px;
    }

    .texto-materia{
        font-size:0.95rem;
        line-height:1.7;
    }

}

</style>

</head>

<body>

<div class="container">

    <div id="noticia"></div>

</div>

<script>

const api = "http://localhost:3000/alerta";

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

async function carregarNoticia(){

    const resposta = await fetch(`${api}/${id}`);

    const noticia = await resposta.json();

    const dados = noticia.alerta;

    document.getElementById("noticia").innerHTML = `

        <div class="card-noticia">

            <span class="categoria">
                ${noticia.categoria}
            </span>

            <h1>
                ${noticia.titulo}
            </h1>

            <img src="${noticia.imagem}">

            <p>
                ${noticia.conteudo}
            </p>

            <a
                href="HomePage.html"
                class="btn btn-primary btn-voltar"
            >
                Voltar
            </a>

        </div>

    `;
}

carregarNoticia();

</script>

</body>
</html>
